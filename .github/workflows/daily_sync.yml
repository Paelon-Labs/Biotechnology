name: Daily Biotech Market Sync

# Each trading day: pull the Nasdaq screener, upsert the biotech universe into
# the opportunity Supabase table `biotech_market` (point in time), and commit
# today's CSV. A previous month's CSV is archived to History/ as that month's
# month-end snapshot (see Daily Markets/scraper.py).

on:
  schedule:
    # 22:15 UTC weekdays = 6:15pm EDT / 5:15pm EST, after the close year-round.
    # Holidays are skipped by the script (NYSE calendar).
    - cron: '15 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if today is not a trading day'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: biotech-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests exchange_calendars

      - name: Pull screener, write Supabase + CSV
        working-directory: ./Daily Markets
        env:
          OPPORTUNITY_SUPABASE_URL: ${{ secrets.OPPORTUNITY_SUPABASE_URL }}
          OPPORTUNITY_SUPABASE_SERVICE_KEY: ${{ secrets.OPPORTUNITY_SUPABASE_SERVICE_KEY }}
        run: python scraper.py ${{ inputs.force && '--force' || '' }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"

          # 'git add -A' tracks additions, modifications, AND deletions
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync: Biotech Data $(TZ=America/New_York date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
